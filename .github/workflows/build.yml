on: [push, pull_request]
name: Build
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        features:
          - remote-clearadi
          - remote-anisette-v3
      fail-fast: false
    name: ${{ matrix.os }} with ${{ matrix.features }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --features '${{ matrix.features }}'
  test:
    name: icloud_auth unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      # --lib only: tests/gsa_auth.rs is a live sign-in that needs a real Apple
      # ID typed on stdin, and omnisette's test_adi provisions real anisette.
      # Off macOS, omnisette has no default anisette provider without a remote
      # feature; remote-anisette-v3 is the one export-findmy builds with.
      - run: cargo test -p icloud_auth --lib --features remote-anisette-v3
